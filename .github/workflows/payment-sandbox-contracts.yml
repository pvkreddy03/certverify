name: Payment Sandbox Contract Tests

on:
  push:
    branches:
      - fix/20261024-payment-sandbox-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-contracts:
    name: Offline payment and billing tests (not release approval)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SECRET_KEY: ci-placeholder-secret-key
      CERTVERIFY_PAYMENT_MODE: disabled
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated billing and payment unit tests
        run: npx tsx --test tests/payments.test.ts tests/payment-readiness.test.ts tests/billing.test.ts tests/payment-simulation.test.ts
      - name: Verify TypeScript contracts
        run: npx next typegen && npm run typecheck
      # The primary CertVerify CI still enforces npm audit and browser contracts.
      # This workflow is NOT an authorization to release or collect money.
