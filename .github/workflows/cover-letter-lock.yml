name: Update cover-letter dependencies lock
on:
  push:
    branches: [feature/cover-letter-qr-designer-20261030]
    paths: [package.json, .github/workflows/cover-letter-lock.yml]
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m "Lock audited cover letter document dependencies"
            git push origin HEAD:feature/cover-letter-qr-designer-20261030
          fi
