name: CertVerify CI

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - fix/team-invitations-and-auth
      - fix/ci-lint-errors
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certverify-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only. Real credentials are never exposed to CI.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SECRET_KEY: ci-placeholder-secret-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Print review-only migration manifest
        run: npm run hosting:migrations
      - name: Run ESLint
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Test isolated PostgreSQL authorization and invitation races
        run: npm run test:db
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser contract tests
        run: npm run test:browser
      - name: Generate Next.js types and check TypeScript
        run: npx next typegen && npm run typecheck
      - name: Build Next.js application
        env:
          # Public pages must compile without the privileged Supabase binding.
          SUPABASE_SECRET_KEY: ''
          CERTVERIFY_RATE_LIMIT_SECRET: ci-offline-private-rate-budget-sentinel-only
        run: npm run build
